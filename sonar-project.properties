sonar.projectKey=nas-sync-client
sonar.projectName=nas-sync-client
sonar.projectVersion=0.9.0

sonar.sources=src,backend/src
sonar.tests=tests/unit,tests/component,tests/e2e,backend/tests
sonar.test.exclusions=tests/e2e/.features-gen/**,tests/e2e/allure-results/**,tests/e2e/allure-report/**
sonar.cpd.exclusions=src/i18n/lang/**

sonar.sourceEncoding=UTF-8

# Coverage report.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts,src/types.ts
sonar.rust.lcov.reportPaths=backend/coverage/lcov.info
sonar.rust.clippyReport.reportPaths=backend/clippy-report.json
