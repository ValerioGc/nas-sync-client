# Build and release pipeline of nas-sync-client, triggered by a version tag.
name: Build

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  APP_NAME: nas-sync-client

jobs:
  audit-dependencies:
    name: Audit application dependencies
    uses: ./.github/workflows/audit.yml
    permissions:
      contents: read

  verify-release:
    name: Verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify tag, versions and changelog
        run: node scripts/pipeline/verify_release.mjs "${GITHUB_REF_NAME}"

      - name: Verify tagged commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} must point to a commit already reachable from main."
            exit 1
          fi

  verify-frontend:
    name: Verify frontend quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check lint and lockfile
        run: npm run lint

      - name: Check coverage for every source file
        run: npm run test:coverage

      - name: Verify frontend production build
        run: npm run test:build

  build-windows:
    name: Build Windows installer
    needs: [verify-release, audit-dependencies, verify-frontend]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend

      - name: Install npm dependencies
        run: npm ci

      # The script downloads the official Syncthing of the platform and checks its SHA-256.
      - name: Build Windows installer bundles
        run: npm run tauri -- build

      - name: Collect Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $nsis = Get-ChildItem -Path backend/target/release/bundle/nsis -Filter *.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$nsis) { Write-Error "No NSIS .exe installer found."; exit 1 }

          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Copy-Item $nsis.FullName "release-assets/$($env:APP_NAME)_${version}_windows_x64.exe" -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    name: Build Linux packages
    needs: [verify-release, audit-dependencies, verify-frontend]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libdbus-1-dev patchelf build-essential libssl-dev curl wget file

      - name: Install npm dependencies
        run: npm ci

      - name: Build Linux bundles
        run: npm run tauri -- build

      - name: Collect Linux packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          version="${GITHUB_REF_NAME#v}"

          appimage=$(find backend/target/release/bundle/appimage -name '*.AppImage' | head -n 1)
          if [[ -z "$appimage" ]]; then echo "No .AppImage found."; exit 1; fi
          cp "$appimage" "release-assets/${APP_NAME}_${version}_linux_x64_portable.AppImage"

          deb=$(find backend/target/release/bundle/deb -name '*.deb' | head -n 1)
          if [[ -z "$deb" ]]; then echo "No .deb found."; exit 1; fi
          cp "$deb" "release-assets/${APP_NAME}_${version}_linux_x64.deb"

      - name: Upload Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-installers
          path: release-assets/*
          if-no-files-found: error

  create-release:
    name: Create release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installers
          path: release-assets

      - name: Download Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-installers
          path: release-assets

      - name: Compute combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# nas-sync-client ${GITHUB_REF_NAME}"
            echo
            node scripts/pipeline/extract-changelog.cjs "${GITHUB_REF_NAME#v}"
            echo
            echo "## Checksums (SHA-256)"
            echo
            echo '```'
            cat release-assets/SHA256SUMS.txt
            echo '```'
          } > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: nas-sync-client ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-artifacts:
    name: Remove temporary build artifacts
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifacts after publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifact_ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --paginate --jq '.artifacts[].id')
          for artifact_id in $artifact_ids; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
